# ============================================================================
# 研究配置的单一真源（Single Source of Truth）
#
# 为什么要有这个文件
# ------------------
# 2026-08-17 实测发现：`switch_market.sh jp` 只用 sed 换掉了 provider_uri
# 这一行，`market` / `benchmark` / 三段日期 / 涨跌停阈值 **全都没换**。
# 结果是 JP 模式下 Qlib 拿到的是：
#
#     provider_uri: jp_smallcap_300      # 数据从 2022-01-04 开始
#     market:       csi300               # JP 数据里根本没有 csi300.txt
#     benchmark:    SH000300             # JP 数据里没有这个指数
#     segments:     train 2008..2014 / valid 2015..2016 / test 2017..2020
#                                        # 三段全都在数据存在之前
#
# 也就是说 JP 那条线**从来没有真正跑出过有意义的数字**，而且 RD-Agent
# 看到的说明文字（被 patch_market_switch.py 改成读环境变量）说的是
# 2022-2023，跟 yaml 里的 2008-2014 完全不一致 —— 那个 patch 修好了
# 文字，却没修 yaml，等于把错位藏得更深。
#
# 所以现在所有市场相关的东西**只在这个文件里定义一次**，由
# scripts/apply_market_config.py 统一写进 Qlib 的两个 yaml，
# 并且由 validation/validate.py 的 Gate 1 反过来校验实际生效值。
# 改任何日期/市场/基准，只改这里。
#
# ⚠️ 日期不是猜的。全部来自 2026-08-17 在 Codespace 里实测的日历：
#     cn_data          : 6450 个交易日, 2000-01-04 -> 2026-08-14
#     jp_smallcap      : 978 个交易日, 2022-01-04 -> 2025-12-30, 1762 只
#     jp_smallcap_300  : 978 个交易日, 2022-01-04 -> 2025-12-30,  300 只
# 换数据以后必须重新实测并更新这里（health_check 会检查是否对得上）。
# ============================================================================

schema_version: 1

markets:

  # --------------------------------------------------------------------------
  # 中国 CSI300（RD-Agent / Qlib 官方默认）
  # --------------------------------------------------------------------------
  cn:
    display_name: "CSI300"
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
    market: csi300
    benchmark: SH000300           # 真实指数，不是占位

    # 实测日历边界，用来给 Gate 1 做「切分有没有超出数据范围」的硬校验
    data_available: ["2000-01-04", "2026-08-14"]

    # 涨跌停：A 股 ±10%，官方模板用 0.095 留一点余量
    limit_threshold: 0.095
    open_cost: 0.0005
    close_cost: 0.0015
    min_cost: 5

    splits:
      # train / validation 保持官方原值，这样 2026-08-16 那轮已有实验
      # （EXP-0004）依然可比，不会因为这次改造而失去参照。
      train:        ["2008-01-01", "2014-12-31"]
      validation:   ["2015-01-01", "2016-12-31"]
      # RD-Agent 每一轮看到的就是这一段（Qlib 配置里的 test）
      research_oos: ["2017-01-01", "2020-08-01"]
      # RD-Agent 永远看不到。
      #
      # ⚠️ 为什么起点是 2022-08-02 而不是更早：官方 conf_combined_factors.yaml
      # 的 data_handler_config.end_time 写死 2022-08-01，也就是 2026-08-16 那轮
      # 已经跑过的实验（EXP-0004），它的取数窗口已经覆盖到 2022-08-01。虽然
      # RD-Agent 当时只看到 test=2017..2020 的结果，但为了让 Frozen Test 的
      # 「从未被任何一轮加载过」这条性质在程序上成立、可被 Gate 1 验证，
      # 起点必须排在 2022-08-01 之后。这是 Gate 1 自己跑出来的发现，
      # 不是拍脑袋定的。
      frozen_test:  ["2022-08-02", "2026-08-14"]

  # --------------------------------------------------------------------------
  # 日本小盘股（TOPIX Small 1/2，300 只精简版）
  # --------------------------------------------------------------------------
  jp:
    display_name: "JP Small-Cap (TOPIX Small 1/2, 300只精简版)"
    provider_uri: "~/.qlib/qlib_data/jp_smallcap_300"
    region: cn                    # Qlib 官方只有 REG_CN / REG_US 两个预设，
                                  # 没有日本。这里沿用 cn，只影响默认交易
                                  # 规则常量，真正生效的成本/涨跌停在下面显式给。
    market: all                   # JP 数据目录里只有 instruments/all.txt，
                                  # 没有 csi300.txt —— 实测确认。
    benchmark:
      # 禁止「随便找一只股票当基准」。这里用一个明确、可重复计算的
      # 等权市场组合：股票池全体成分的日均涨跌。
      # Qlib 原生支持 benchmark 传 list，语义就是「列表内股票的日均变化」
      # （qlib/backtest/report.py 第 62-64 行），不需要额外造轮子。
      # apply_market_config.py 会在生成 yaml 时把它展开成显式代码列表，
      # 所以生成出来的 yaml 是完全可审计的，不依赖运行时再去解析。
      kind: equal_weight_universe
      source: instruments/all.txt

    data_available: ["2022-01-04", "2025-12-30"]

    # 日本涨跌停是阶梯表（按股价区间给绝对值幅度），不是固定比例，
    # 没法用 Qlib 的单一 limit_threshold 表达。**这里显式不设**，
    # 也就是不模拟涨跌停。这是一个已知的、写进结果里的未解决项，
    # 不是忘了填。见 README「JP 回测还剩哪些未解决的问题」。
    limit_threshold: null
    # 日本小盘股实际摩擦远高于 A 股。这里给的是保守估计，
    # 并且 Gate 3 会额外报成本敏感性，不靠这一个数字下结论。
    open_cost: 0.0015
    close_cost: 0.0015
    min_cost: 0

    splits:
      # 978 个交易日切四段。边界一律用**实测存在的交易日**，不用
      # 2022-01-01 这种日历日 —— 那样既说不清「到底从哪天开始」，
      # 也让段间重叠检查变得模糊。实测每段交易日数：
      #   train        2022-01-04 .. 2023-06-30  366 天
      #   validation   2023-07-03 .. 2023-12-29  124 天
      #   research_oos 2024-01-04 .. 2024-12-30  245 天
      #   frozen_test  2025-01-06 .. 2025-12-30  243 天
      # Frozen Test 取最新的、连续的一整年，符合「较新的连续一段历史」。
      train:        ["2022-01-04", "2023-06-30"]
      validation:   ["2023-07-03", "2023-12-29"]
      research_oos: ["2024-01-04", "2024-12-30"]
      frozen_test:  ["2025-01-06", "2025-12-30"]

    # --------------------------------------------------------------------
    # 已知可信性缺陷，必须随每次实验结果一起记录，不许静默
    # --------------------------------------------------------------------
    known_risks:
      # 实测 2026-08-17：instruments/all.txt 里 300 只有 291 只的起始日
      # 都是 2022-01-04（另外 9 只是上市较晚），没有任何一只带「晚于
      # 数据起点才进入股票池」的记录。说明这份股票池是
      # 「2022-2025 任意月末出现在 TOPIX Small 1/2 的并集」，
      # 不是逐月时点正确的成分股。
      # 后果：2024 年才被降级进 Small 的股票，在 2022 年就已经在池子里。
      # 这是成分股层面的前视偏差，不是退市偏差（退市侧是好的：
      # 300 只里 25 只有提前结束日期，退市股票会自然消失）。
      point_in_time_universe: false
      universe_membership_lookahead: true
      universe_note: >-
        股票池 = 2022-2025 期间任意月末属于 TOPIX Small 1/2 的并集（300 只精简版）。
        退市侧正确（25/300 有提前结束日期），进入侧有前视偏差（291/300 起始日
        统一为数据起点 2022-01-04）。严谨做法是逐月用 J-Quants
        master_month_end 快照重建，代码已存在于私有仓库
        ~/jquants/每日横截面短期反转因子/src/jquants_reversal/experiment.py
        的 prepare_experiment_data()，但还没有接进这份 .bin 数据的生成流程。
        参考量级：私有仓库实测「简化并集 + 无流动性过滤」的信号强度只有
        严谨版的 39%（Rank IC 0.0113 vs 0.0292）。
      price_limit_simulation: false
      price_limit_note: >-
        日本涨跌停是按股价区间的阶梯绝对值表，不是固定比例，Qlib 的
        limit_threshold 表达不了，因此这次不模拟涨跌停。
      liquidity_filter: false
      liquidity_filter_note: >-
        这份 .bin 数据没有套用任何最小成交额门槛。私有仓库实测：去掉
        3000 万日元/日的中位成交额门槛后，同一个因子的多空毛年化从
        +2.78% 掉到 -2.96%，即被门槛挡掉的股票只贡献噪声和成本。

# ============================================================================
# Validation Gate 的配置
# ============================================================================
gate:
  # 第一版刻意不设武断的绝对阈值（比如 IC > 0.03）。
  # 只有「一定是错」的东西才判 FAIL；「好不好」交给人看 knowledge_map。
  # 这条原则是故意的：宁可结果少，也不要产生假的量化结论。

  gate1_data_safety:
    enabled: true
    # 这些是「结构性错误」，不是「表现不好」，所以全部 FAIL 而不是 WARN
    fail_on:
      - segments_overlap                  # 三段日期有重叠
      - segments_outside_data_range        # 切分超出数据实际范围
      - provider_market_mismatch           # 说明文字的市场 ≠ provider_uri 的市场
      - factor_source_provider_mismatch    # 因子源数据 daily_pv.h5 ≠ provider_uri 的数据
      - label_horizon_mismatch             # 标签用到了因子日之前/当日的价格
      - frozen_test_leaked_into_research   # 普通 loop 的配置碰到了 frozen 区间

  gate2_factor_information:
    enabled: true
    # 只记录不判定：IC / Rank IC / ICIR / Rank ICIR / 分段 IC
    report_only: true

  gate3_incremental_value:
    enabled: true
    # baseline vs baseline+新因子，必须两边都有数字才算有效比较
    require_baseline: true
    compare_metrics:
      - IC
      - Rank IC
      - ICIR
      - Rank ICIR
      - 1day.excess_return_without_cost.annualized_return
      - 1day.excess_return_with_cost.annualized_return
      - 1day.excess_return_with_cost.information_ratio
      - 1day.excess_return_with_cost.max_drawdown
    # 唯一的硬性判定：新因子必须真的带来增量信息，否则 FAIL。
    # 判据用 Rank IC，因为它比年化收益稳健得多（不被右尾支配）。
    fail_if_no_incremental_rank_ic: true
    # 允许的浮动：小于这个差值视为「没有增量」，避免把噪声当改进。
    min_rank_ic_improvement: 0.0005

  gate4_stability:
    enabled: true
    # 第一版只按时间切片，不做市值/流动性/波动率分组（按要求不过度开发）
    slice_by: year          # year | half_year
    report_only: false
    # 唯一的硬性判定：如果整体正收益完全靠单一区间撑起来，判 FAIL。
    # 判据：去掉贡献最大的那一个切片之后，超额收益是否还为正。
    fail_if_single_slice_carries_all: true
